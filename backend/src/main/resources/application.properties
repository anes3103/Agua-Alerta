spring.application.name=agua-alerta

spring.datasource.url=jdbc:postgresql://localhost:5432/agua_alerta
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Para o Hibernate entender dados geográficos (PostGIS)
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgreSQLSpatialDialect

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
